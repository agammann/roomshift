name: Verify production
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: roomshift-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck && pnpm build && pnpm manifest
      - name: Package and extract a fresh production consumer
        run: |
          tar -C dist -czf roomshift-production.tgz .
          sha256sum roomshift-production.tgz > reports/archive.sha256
          mkdir "$RUNNER_TEMP/roomshift-consumer"
          tar -xzf roomshift-production.tgz -C "$RUNNER_TEMP/roomshift-consumer"
      - name: Record the runner-provided Chrome version
        run: google-chrome --version > reports/browser-version.txt
      - name: Test delivered production assets without XR emulation
        run: pnpm test:browser
        env:
          ROOMSHIFT_DIST: ${{ runner.temp }}/roomshift-consumer
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: roomshift-validation-${{ github.sha }}
          path: |
            roomshift-production.tgz
            reports/
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
